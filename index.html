<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Escuela Luis Llorens Torres</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Caveat:wght@600&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap">
<style>
@property --bg{syntax:"<color>";inherits:true;initial-value:#0B1020}
@property --panel{syntax:"<color>";inherits:true;initial-value:#111A2E}
@property --card{syntax:"<color>";inherits:true;initial-value:#1A2742}
@property --accent{syntax:"<color>";inherits:true;initial-value:#6D8BC8}
:root{--bg:#0B1020;--panel:#111A2E;--card:#1A2742;--accent:#6D8BC8;--text:#D7DEEB;--muted:#8D9AB8;--line:rgba(215,222,235,.13);--line2:rgba(215,222,235,.26);--ease:cubic-bezier(.2,.8,.2,1);
--display:Anton,Impact,"Arial Narrow",sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
transition:--bg .6s,--panel .6s,--card .6s,--accent .6s;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:76px;scroll-behavior:smooth;-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:400 16.5px/1.6 Inter,system-ui,sans-serif;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
h1,h2,h3{font-family:var(--display);font-weight:400;text-transform:uppercase;line-height:.98;letter-spacing:.005em;margin:0}
a{color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
a,button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px;position:relative}
.tag,.eyebrow{display:block;font-family:var(--mono);font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:14px}
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:60;background:var(--bg);border-bottom:1px solid var(--line);transition:background-color .6s}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;height:58px}
.logo{display:flex;align-items:center;gap:10px;min-width:0;text-decoration:none;font-family:var(--display);text-transform:uppercase;font-size:1.15rem;letter-spacing:.02em}
.mark{flex:none;display:grid;place-items:center;width:36px;height:36px;border:1px solid var(--accent);color:var(--accent);font:500 .68rem var(--mono);letter-spacing:.06em;border-radius:2px}
.lt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu-btn{flex:none;display:inline-flex;align-items:center;gap:10px;min-height:42px;padding:0 14px;border:1px solid var(--line2);border-radius:3px;background:transparent;font-family:var(--mono);font-size:.76rem;letter-spacing:.12em;text-transform:uppercase}
.menu-btn i{display:block;position:relative;width:16px;height:1.5px;background:currentColor;transition:background-color .2s}
.menu-btn i::before,.menu-btn i::after{content:"";position:absolute;left:0;width:16px;height:1.5px;background:currentColor;transition:transform .25s var(--ease)}
.menu-btn i::before{top:-5px}.menu-btn i::after{top:5px}
.menu-open .menu-btn i{background:transparent}
.menu-open .menu-btn i::before{transform:translateY(5px) rotate(45deg)}
.menu-open .menu-btn i::after{transform:translateY(-5px) rotate(-45deg)}
nav{position:fixed;left:0;right:0;bottom:0;top:calc(env(safe-area-inset-top,0px) + 59px);background:var(--bg);display:flex;flex-direction:column;padding:8px 20px calc(28px + env(safe-area-inset-bottom,0px));overflow-y:auto;opacity:0;visibility:hidden;transform:translateY(-8px);transition:opacity .25s,transform .25s var(--ease),visibility 0s .25s;z-index:5}
.menu-open nav{opacity:1;visibility:visible;transform:none;transition-delay:0s}
nav a{display:flex;align-items:baseline;gap:14px;min-height:60px;align-items:center;border-bottom:1px solid var(--line);text-decoration:none;font-family:var(--display);text-transform:uppercase;font-size:1.9rem;letter-spacing:.01em;color:var(--text);transition:color .2s,padding .25s var(--ease)}
nav a:active{color:var(--accent);padding-left:8px}
nav a[aria-current]{color:var(--accent)}
.n{font-family:var(--mono);font-size:.72rem;letter-spacing:.1em;color:var(--accent)}
@media (min-width:1100px){
.menu-btn{display:none}
.bar .wrap{max-width:1240px;height:64px}
nav{position:static;flex-direction:row;align-items:center;gap:0;padding:0;overflow:visible;opacity:1;visibility:visible;transform:none;background:transparent;transition:none}
nav a{min-height:40px;padding:0 12px;border:0;font-family:var(--mono);font-size:.72rem;letter-spacing:.1em;position:relative}
nav a .n{display:none}
nav a::after{content:"";position:absolute;left:12px;right:12px;bottom:4px;height:1.5px;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform .3s var(--ease)}
nav a:hover::after,nav a[aria-current]::after{transform:none}
nav a:hover{color:var(--accent);padding-left:12px}
}
.cover{border-bottom:1px solid var(--line)}
.cgrid{display:grid;grid-template-columns:1fr}
.cmain{padding:40px 0 36px}
.cside{padding:8px 0 32px;display:flex;flex-direction:column;border-top:1px solid var(--line)}
@media (min-width:860px){.cgrid{grid-template-columns:65fr 35fr}.cmain{padding:76px 36px 76px 0;border-right:1px solid var(--line)}.cside{padding:76px 0 60px 32px;border-top:0}}
.cover h1{font-size:clamp(3.3rem,15vw,5.6rem);line-height:.9;margin:6px 0 26px}
@media (min-width:860px){.cover h1{font-size:clamp(3rem,8.2vw,7.2rem)}}
.cover .ln{display:block;white-space:nowrap}
.cover p{max-width:46ch;color:var(--muted);font-size:1.1rem;margin:0}
.cover .links{margin-top:28px}
.cside .tag{margin-top:24px}
.facts{margin:0}
.facts>div{display:flex;align-items:baseline;gap:16px;padding:14px 0;border-top:1px solid var(--line)}
.facts dt{font-family:var(--display);font-size:2.8rem;line-height:1;min-width:2.1ch;color:var(--text)}
.facts dt.hr{font-size:1.9rem;min-width:0}
.facts dd{margin:0;font-family:var(--mono);font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.cstatus{display:flex;align-items:center;gap:10px;margin-top:auto;padding-top:16px;border-top:1px solid var(--line);font-family:var(--mono);font-size:.74rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.dot{flex:none;width:9px;height:9px;border-radius:50%;background:#56648a}
.dot.on{background:#46d98b}
section{padding:52px 0}
@media (min-width:720px){section{padding:76px 0}}
section h2{font-size:clamp(2.2rem,7vw,3.8rem);margin-bottom:12px}
.lead{color:var(--muted);max-width:60ch;margin:0 0 26px}
.cats{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:720px){.cats{grid-template-columns:repeat(12,1fr)}.w7{grid-column:span 7}.w5{grid-column:span 5}.w4{grid-column:span 4}}
.cat{display:flex;flex-direction:column;gap:12px;min-height:210px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:3px;padding:20px;transition:border-color .25s,background-color .25s,transform .25s var(--ease)}
.cat .no{font-family:var(--mono);font-size:.78rem;letter-spacing:.1em;color:var(--c)}
.cat .ct{font-family:var(--display);text-transform:uppercase;font-size:clamp(2rem,6vw,2.7rem);line-height:.98}
.w7 .ct{font-size:clamp(2.6rem,7vw,4rem)}
.cat .cd{color:var(--muted);max-width:34ch}
.cat .cf{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.cat .go{color:var(--c);font-size:1.4rem;transition:transform .25s var(--ease)}
.cat:hover,.cat:focus-visible,.cat:active{border-color:var(--c)}
.cat:hover .go,.cat:active .go{transform:translateX(8px)}
.dtools{display:flex;flex-direction:column;gap:12px;margin-bottom:10px}
#buscar{width:100%;min-height:54px;background:var(--panel);border:1px solid var(--line2);border-radius:3px;padding:0 16px;transition:border-color .2s}
#buscar::placeholder{color:var(--muted)}
#buscar:focus{outline:none;border-color:var(--accent)}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.fbtn{min-height:40px;padding:0 14px;background:transparent;border:1px solid var(--line2);border-radius:3px;font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);transition:background-color .2s,color .2s,border-color .2s}
.fbtn:hover{border-color:var(--accent);color:var(--text)}
.fbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#0B1020}
.dcount{font-family:var(--mono);font-size:.74rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin:12px 0}
.dir{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:16px 4px;transition:background-color .2s,padding .25s var(--ease)}
.row:hover,.row:focus-visible{background:var(--panel);padding-left:14px}
.rt{font-family:var(--mono);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--c)}
.rn{font-family:var(--display);text-transform:uppercase;font-size:1.55rem;line-height:1.05}
.rp{color:var(--muted);font-size:.92rem}
.ra{grid-row:1/4;grid-column:2;color:var(--accent);font-size:1.3rem;transition:transform .25s var(--ease)}
.row:hover .ra{transform:translateX(6px)}
.empty{padding:28px 4px;color:var(--muted);border-bottom:1px solid var(--line)}
.scrim{position:fixed;inset:0;background:rgba(4,7,16,.72);opacity:0;pointer-events:none;transition:opacity .25s;z-index:70}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;z-index:75;left:0;right:0;bottom:0;max-height:88vh;overflow-y:auto;background:var(--panel);border:1px solid var(--line2);border-radius:10px 10px 0 0;padding:20px 20px calc(28px + env(safe-area-inset-bottom,0px));transform:translateY(100%);visibility:hidden;transition:transform .3s var(--ease),visibility 0s .3s}
.drawer.on{transform:none;visibility:visible;transition-delay:0s}
@media (min-width:720px){.drawer{left:auto;top:0;right:0;bottom:0;width:min(480px,92vw);max-height:none;border-radius:0;transform:translateX(100%)}}
.dh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:6px}
.x{flex:none;width:44px;height:44px;border:1px solid var(--line2);border-radius:3px;background:transparent;font-size:1rem;transition:border-color .2s}
.x:hover{border-color:var(--accent)}
.drawer h3{font-size:2.4rem;margin:6px 0 12px}
.drawer h4{font-family:var(--mono);font-weight:500;font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:22px 0 10px}
.drawer p{color:var(--muted);margin:0}
.hero{position:relative;background:var(--panel);border-bottom:1px solid var(--line);padding:26px 0 34px}
.hero h1{font-size:clamp(2.6rem,10vw,5.6rem);line-height:.92;max-width:none}
.hero p{color:var(--muted);max-width:58ch;margin:14px 0 0}
.gs{opacity:0}
.go .gs{animation:rise .6s var(--ease) both;animation-delay:var(--dl,.05s)}
.back{background:transparent;border:1px solid var(--line2);color:var(--text);border-radius:3px;padding:0 16px;min-height:42px;margin-bottom:22px;font-family:var(--mono);font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;transition:border-color .2s,transform .25s var(--ease)}
.back:hover{border-color:var(--accent);transform:translateX(-4px)}
.oh{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:24px;transition:border-color .25s}
.panel:hover{border-color:var(--line2)}
.panel h3{font-size:1.6rem;margin-bottom:10px}
.cols,.cols3,.ogrid,.stats{display:grid;gap:12px}
.cols{grid-template-columns:1fr}
.cols3{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.ogrid{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.stats{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));text-align:left}
@media (min-width:720px){.cols{grid-template-columns:1fr 1fr}}
.oc{display:flex;gap:18px;align-items:center;text-align:left;width:100%;min-height:128px;background:var(--card);border:1px solid var(--line);border-radius:3px;padding:18px;transition:border-color .25s,background-color .25s}
.oc:hover,.oc:focus-visible,.oc:active{border-color:var(--c)}
.lg,.ic{flex:none;width:84px;height:84px;border-radius:50%;border:1px solid var(--line2);background:#fff}
.ic{display:grid;place-items:center;font-size:2.5rem;background:color-mix(in srgb,var(--c) 16%,var(--card))}
.lg.big,.ic.big{width:104px;height:104px}
.ic.big{background:var(--card);font-size:3rem}
.nm{display:block;font-family:var(--display);text-transform:uppercase;font-weight:400;font-size:1.6rem;line-height:1.05}
.full{display:block;font-family:var(--mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.oc p{margin:8px 0 6px;font-size:.96rem;color:var(--muted)}
.arr{display:inline-block;color:var(--c,var(--accent));font-family:var(--mono);font-size:.76rem;letter-spacing:.1em;text-transform:uppercase;transition:transform .25s var(--ease)}
.oc:hover .arr,.oc:active .arr{transform:translateX(8px)}
.pc{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.pc span{border:1px solid var(--line2);border-radius:2px;padding:0 8px;font-family:var(--mono);font-size:.68rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.time{font-family:var(--display);font-size:2.6rem;line-height:1;margin:8px 0 6px}
.links{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:50px;background:var(--accent);color:#0B1020;border:0;border-radius:3px;padding:0 22px;font-family:var(--mono);font-weight:500;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;transition:filter .2s,transform .25s var(--ease)}
.btn:hover{filter:brightness(1.14);transform:translateY(-2px)}
.btn:active{transform:scale(.97)}
.btn.sun{background:var(--text)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line2)}
.btn.ghost:hover{border-color:var(--accent)}
.num{font-family:var(--display);font-size:3rem;line-height:1;color:var(--accent)}
.tl{position:relative;padding-left:30px;margin-left:6px}
.tl::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--accent);transform-origin:top;transform:scaleY(0);transition:transform 1.2s cubic-bezier(.6,0,.2,1)}
.tl.in::before{transform:none}
.it{position:relative;margin-bottom:26px}
.it::before{content:"";position:absolute;left:-35px;top:9px;width:10px;height:10px;background:var(--accent)}
.yr{font-family:var(--display);font-size:2rem;color:var(--accent);line-height:1}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chip{border:1px solid var(--line2);border-radius:2px;padding:3px 12px;font-family:var(--mono);font-size:.74rem;letter-spacing:.04em;text-transform:uppercase}
.lema{font-family:var(--display);text-transform:uppercase;font-size:1.7rem;color:var(--accent);line-height:1.05}
.list{margin:0;padding-left:20px;color:var(--muted)}.list li{margin-bottom:8px}.list li::marker{color:var(--accent)}
.teacher{display:flex;align-items:center;gap:14px;margin:20px 0 0;padding:14px 16px;border:1px solid var(--line2);border-radius:3px;background:var(--bg)}
.av{flex:none;display:grid;place-items:center;width:48px;height:48px;border-radius:50%;background:var(--accent);color:#0B1020;font:500 .9rem var(--mono);letter-spacing:.04em}
.teacher small{display:block;font-family:var(--mono);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);line-height:1.4}
.teacher b{font-weight:600;font-size:1.05rem;color:var(--text);line-height:1.3}
.mini{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}
.mb{border:0;background:none;padding:0;border-radius:50%;transition:transform .25s var(--ease)}
.mb img{width:64px;height:64px;border-radius:50%;border:1px solid var(--line2);background:#fff}
.mi{display:grid;place-items:center;width:64px;height:64px;border-radius:50%;border:1px solid var(--line2);background:var(--card);font-size:1.8rem}
.mb:hover{transform:translateY(-4px)}
.join{background:var(--card);border:1px solid var(--line2);border-radius:3px;padding:44px 22px;text-align:center}
.join h2{font-size:clamp(2.2rem,7vw,3.8rem)}
.join p{color:var(--muted);max-width:56ch;margin:14px auto}
.join .links{justify-content:center}
.steps{max-height:0;overflow:hidden;transition:max-height .6s var(--ease);text-align:left;max-width:560px;margin:0 auto;color:var(--muted)}
.steps.open{max-height:520px}
.steps ol{margin:20px 0 0;padding-left:22px}
.soon{color:var(--muted);font-family:var(--mono);font-size:.76rem;letter-spacing:.04em;text-transform:uppercase}
footer{border-top:1px solid var(--line);background:var(--panel);margin-top:40px;padding:48px 0 calc(28px + env(safe-area-inset-bottom,0px));color:var(--muted)}
.fgrid{display:grid;gap:30px;grid-template-columns:1fr}
@media (min-width:720px){.fgrid{grid-template-columns:1.5fr 1fr 1fr}}
.fcol b{display:block;font-family:var(--mono);font-weight:500;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:12px}
.fcol b.fn{font-family:var(--display);font-weight:400;font-size:2rem;letter-spacing:0;color:var(--text);line-height:1}
.fcol p{margin:0 0 6px}
.fcol a{display:block;padding:6px 0;text-decoration:none;transition:color .2s,transform .25s var(--ease)}
.fcol a:hover{color:var(--text);transform:translateX(6px)}
.fbot{margin-top:36px;padding-top:24px;border-top:1px solid var(--line);text-align:center;font-size:.86rem}
.sign{font-family:Caveat,"Segoe Script",cursive;font-weight:600;font-size:2.6rem;color:var(--text);clip-path:inset(0 100% 0 0);transition:clip-path 1.4s cubic-bezier(.6,0,.2,1) .2s;display:inline-block;padding:0 6px}
.in .sign{clip-path:inset(0 0 0 0)}
.rv{opacity:0}
.rv.in{opacity:1;animation:reveal .6s var(--ease) var(--d,0s) backwards}
.vin{animation:vin .35s var(--ease) both}
.top{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:50px;height:50px;border:1px solid var(--accent);border-radius:3px;background:var(--bg);color:var(--accent);font-size:1.3rem;opacity:0;visibility:hidden;transform:translateY(10px);transition:opacity .25s,transform .25s var(--ease),visibility .25s;z-index:40}
.top.show{opacity:1;visibility:visible;transform:none}
@keyframes reveal{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes vin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* ===== Efectos y animaciones ===== */
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:100;opacity:.045;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.progress{position:fixed;top:0;left:0;right:0;height:2px;background:var(--accent);transform-origin:left;transform:scaleX(0);z-index:95}
.boot{position:fixed;inset:0;z-index:120;background:var(--bg);display:grid;place-items:center;transition:transform .7s cubic-bezier(.7,0,.2,1)}
.boot.up{transform:translateY(-100%)}
.bt{width:min(560px,86vw)}
.bn{display:flex;align-items:flex-start;font-family:var(--display);font-size:clamp(6rem,30vw,12rem);line-height:.9}
.bn small{font-size:.26em;margin:.45em 0 0 .12em;color:var(--accent)}
.bl{height:2px;background:var(--line2);margin:14px 0 16px;overflow:hidden}
.bl i{display:block;height:100%;background:var(--accent);transform:scaleX(0);transform-origin:left}
.bs{background:none;border:0;padding:10px 0;font-family:var(--mono);font-size:.76rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.curtain{position:fixed;inset:0;z-index:92;display:flex;pointer-events:none;visibility:hidden}
.curtain i{flex:1;background:var(--accent);transform:scaleY(0);transform-origin:bottom}
.curtain i:nth-child(even){background:var(--card)}
.curtain i:nth-child(1){--k:0}.curtain i:nth-child(2){--k:1}.curtain i:nth-child(3){--k:2}.curtain i:nth-child(4){--k:3}.curtain i:nth-child(5){--k:4}
.curtain.in,.curtain.out{visibility:visible}
.curtain.in i{animation:cin .38s cubic-bezier(.7,0,.2,1) forwards;animation-delay:calc(var(--k)*40ms)}
.curtain.out i{transform:scaleY(1);transform-origin:top;animation:cout .42s cubic-bezier(.7,0,.2,1) forwards;animation-delay:calc(var(--k)*40ms)}
.cover{position:relative;overflow:hidden;isolation:isolate}
.cover::before,.cover::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background-image:linear-gradient(var(--line2) 1px,transparent 1px),linear-gradient(90deg,var(--line2) 1px,transparent 1px);background-size:56px 56px}
.cover::after{opacity:.4;-webkit-mask-image:linear-gradient(180deg,#000,transparent 85%);mask-image:linear-gradient(180deg,#000,transparent 85%);animation:pan 14s linear infinite}
.cover::before{-webkit-mask-image:radial-gradient(380px circle at var(--mx,78%) var(--my,28%),#000,transparent 70%);mask-image:radial-gradient(380px circle at var(--mx,78%) var(--my,28%),#000,transparent 70%)}
.cmain{transform:translateY(calc(var(--sy,0)*-.05px))}
.cside{transform:translateY(calc(var(--sy,0)*.03px))}
.ch{display:inline-block;opacity:0;transition:transform .3s var(--ease),color .3s}

.ch:hover{transform:translateY(-8px);color:var(--accent)}
.rot{display:flex;align-items:center;gap:10px;margin-top:22px;font-family:var(--mono);font-size:.82rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.rw{display:inline-block;height:1.5em;overflow:hidden;border-bottom:1px solid var(--accent)}
.rwi{display:block;transition:transform .6s var(--ease)}
.rwi b{display:block;height:1.5em;line-height:1.5em;font-weight:500;color:var(--accent)}
.facts>div{transition:padding .25s var(--ease),border-color .25s}
.facts>div:hover{padding-left:12px;border-top-color:var(--accent)}
.go .facts>div{animation:rise .6s var(--ease) backwards;animation-delay:calc(.45s + var(--r,0)*80ms)}
.facts>div:nth-child(1){--r:0}.facts>div:nth-child(2){--r:1}.facts>div:nth-child(3){--r:2}.facts>div:nth-child(4){--r:3}.facts>div:nth-child(5){--r:4}.facts>div:nth-child(6){--r:5}
.dot.on{animation:pulse 2s infinite}
.band{overflow:hidden;border-bottom:1px solid var(--line);padding:12px 0;user-select:none}
.track{display:flex;width:max-content;animation:mq 38s linear infinite}
.band.rev .track{animation-direction:reverse;animation-duration:46s}
.band:hover .track{animation-play-state:paused}
.band span{font-family:var(--display);text-transform:uppercase;font-size:clamp(2.4rem,9vw,4.8rem);line-height:1.1;padding:0 .35em;white-space:nowrap;color:transparent;-webkit-text-stroke:1px var(--line2)}
.band span:nth-child(even){color:var(--text);-webkit-text-stroke:0}
.band.rev span:nth-child(even){color:var(--accent)}
.band span::after{content:"✦";font-size:.4em;margin-left:.9em;color:var(--accent);-webkit-text-stroke:0;vertical-align:middle}
.cat,.oc{position:relative;transform:perspective(900px) translateY(var(--lift,0px)) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .35s var(--ease),border-color .25s,background-color .25s}
.cat:hover,.oc:hover{--lift:-4px}
.cat>*,.oc>*{position:relative}
.cat::before,.oc::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(260px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--c,var(--accent)) 20%,transparent),transparent 62%)}
.cat:hover::before,.oc:hover::before{opacity:1}
.cat::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--c);transform:scaleX(0);transform-origin:left;transition:transform .5s var(--ease)}

.cat .ct{transition:letter-spacing .35s var(--ease)}
.cat:hover .ct{letter-spacing:.02em}
.btn{position:relative;overflow:hidden;transform:translate(var(--tx,0px),var(--ty,0px))}
.btn:hover{transform:translate(var(--tx,0px),var(--ty,0px))}
.btn:active{transform:translate(var(--tx,0px),var(--ty,0px)) scale(.97)}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.4) 50%,transparent 70%);transform:translateX(-120%);transition:transform .7s var(--ease)}
.btn:hover::after{transform:translateX(120%)}
.row{position:relative;animation:rowin .45s var(--ease) backwards;animation-delay:calc(var(--k,0)*28ms)}
.row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c);transform:scaleY(0);transition:transform .25s var(--ease)}
.row:hover::before,.row:focus-visible::before{transform:none}

.rv.in h2{animation:clip .8s var(--ease) both}
.hero::after{content:"";position:absolute;left:0;bottom:-1px;height:2px;width:100%;background:var(--accent);transform:scaleX(0);transform-origin:left}
.go .hero::after{animation:line 1s .2s var(--ease) forwards}
.drawer>*{opacity:0;transform:translateY(14px);transition:opacity .35s,transform .45s var(--ease)}
.drawer.on>*{opacity:1;transform:none;transition-delay:calc(.12s + var(--i,0)*55ms)}
.drawer>:nth-child(1){--i:0}.drawer>:nth-child(2){--i:1}.drawer>:nth-child(3){--i:2}.drawer>:nth-child(4){--i:3}.drawer>:nth-child(5){--i:4}.drawer>:nth-child(6){--i:5}

@keyframes slide{from{translate:0 110%;rotate:7deg;opacity:0}to{translate:0 0;rotate:0deg;opacity:1}}
@keyframes cin{to{transform:scaleY(1)}}
@keyframes cout{to{transform:scaleY(0)}}
@keyframes pan{to{background-position:56px 56px}}
@keyframes mq{to{transform:translateX(-50%)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(70,217,139,.55)}70%{box-shadow:0 0 0 9px rgba(70,217,139,0)}100%{box-shadow:0 0 0 0 rgba(70,217,139,0)}}
@keyframes rowin{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:none}}
@keyframes clip{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}

.mw{display:inline-block;overflow:hidden;vertical-align:top;padding:.1em 0 .14em;margin:-.1em 0 -.14em}
.mw>i{display:inline-block;font-style:normal;transform:translateY(115%)}

.lead{--b:.3s}.rv.in h2{animation:none}

.clock .tk{stroke:var(--line2);stroke-width:1;opacity:0}.clock .tk.m{stroke:var(--text);stroke-width:2}

.in .clock .ring{animation:draw 1.4s cubic-bezier(.6,0,.2,1) forwards}

async function cadenaPortada() {

}
async function morph(src, v, fin) {
  const W = innerWidth, H = innerHeight, r = src.getBoundingClientRect(), ac = getComputedStyle(src).getPropertyValue("--c").trim() || "#6D8BC8";
  const vh = $("v-" + v).querySelector("h1"), nom = vh ? (vh.getAttribute("aria-label") || vh.textContent) : C.nombre;
  const o = document.createElement("div"); o.className = "morph"; o.style.setProperty("--c", ac);
  o.innerHTML = '<span class="mt">' + nom.split(/\s+/).map((w, k) => '<span class="mw"><i style="--w:' + k + '">' + w + "</i></span>").join(" ") + "</span>";
  const ins = (t, rt, b, l, rd) => "inset(" + t + "px " + rt + "px " + b + "px " + l + "px round " + rd + "px)";
  const from = ins(r.top, W - r.right, H - r.bottom, r.left, 3), full = ins(0, 0, 0, 0, 0), ease = "cubic-bezier(.7,0,.2,1)";
  o.style.clipPath = from; document.body.appendChild(o);
  try {
    await o.animate([{ clipPath: from }, { clipPath: full }], { duration: 560, easing: ease, fill: "forwards" }).finished;
    o.firstChild.classList.add("show"); await sleep(750);
    fin(); await new Promise(requestAnimationFrame);
    const h = document.querySelector("#v-" + v + " .hero,#v-" + v + " .cover"), hr = h ? h.getBoundingClientRect() : { top: 60, bottom: 260 };
    o.firstChild.style.opacity = 0;
    await o.animate([{ clipPath: full, backgroundColor: ac }, { clipPath: ins(hr.top, 0, Math.max(H - hr.bottom, 0), 0, 0), backgroundColor: (TV[v] || BASE).panel }], { duration: 620, easing: ease, fill: "forwards" }).finished;
    await o.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 300, fill: "forwards" }).finished;

  $("drawer").setAttribute("aria-hidden", "true");
  document.body.classList.remove("lock");
  if (foco && foco.focus) foco.focus({ preventScroll: true });
}

// ====== Clics y teclado ======
document.addEventListener("click", e => {
  const t = e.target;
  if (t.closest("#menu")) { const o = document.body.classList.toggle("menu-open"); $("menu").setAttribute("aria-expanded", o); return; }
  if (t.closest("#dclose") || t.id === "scrim") { cerrarPanel(); return; }
  const ab = t.closest("[data-open]"); if (ab) { abrirPanel(+ab.dataset.open); return; }
  const fb = t.closest(".fbtn"); if (fb) { fc = fb.dataset.f; document.querySelectorAll(".fbtn").forEach(b => b.setAttribute("aria-pressed", b === fb)); pintarDir(); return; }
  if (t.id === "unirme") { const o = $("steps").classList.toggle("open"); t.setAttribute("aria-expanded", o); return; }
  const el = t.closest("[data-v]");
  if (el) { e.preventDefault(); ir(el.dataset.v, el.dataset.s, el.dataset.focus, el); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { cerrarPanel(); cerrarMenu(); }
  if (e.key === "Tab" && $("drawer").classList.contains("on")) {
    const f = [$("dclose"), $("dopen")];
    if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[1].focus(); }
    else if (!e.shiftKey && document.activeElement === f[1]) { e.preventDefault(); f[0].focus(); }
  }
});
matchMedia("(min-width:1100px)").addEventListener("change", cerrarMenu);
mostrar(location.hash.slice(1));

// ====== Estado de horario (hora de Puerto Rico) ======
function estado() {
  const p = new Intl.DateTimeFormat("en-US", { timeZone: "America/Puerto_Rico", weekday: "short", hour: "numeric", minute: "numeric", hour12: false }).formatToParts(new Date());
  const g = t => p.find(x => x.type === t).value;
  const dia = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].indexOf(g("weekday"));
  const min = (+g("hour") % 24) * 60 + +g("minute");
  const H = C.horario, abierta = H.dias.includes(dia) && min >= H.abre[0] * 60 + H.abre[1] && min < H.cierra[0] * 60 + H.cierra[1];
  $("dot").className = "dot" + (abierta ? " on" : "");
  $("status").textContent = abierta ? "Abierta ahora · cierra a las " + hora12(H.cierra) : "Cerrada ahora · abre a las " + hora12(H.abre);
}
estado(); setInterval(estado, 60000);
const fh = new Intl.DateTimeFormat("en-US", { timeZone: "America/Puerto_Rico", hour: "numeric", minute: "numeric", second: "numeric", hour12: false });
function reloj() {
  const p = fh.formatToParts(new Date()), g = t => +p.find(x => x.type === t).value, h = g("hour") % 24, m = g("minute"), sg = g("second");
  const r = (id, a) => $(id).setAttribute("transform", "rotate(" + a + " 100 100)");
  r("ahh", (h % 12 + m / 60) * 30); r("amm", (m + sg / 60) * 6); r("ass", sg * 6);
  $("adg").textContent = pad(h % 12 || 12) + ":" + pad(m) + ":" + pad(sg) + (h < 12 ? " a. m." : " p. m.");
  $("cdot").className = $("dot").className; $("cstat").textContent = $("status").textContent;
}
reloj(); setInterval(reloj, 250);

// ====== Entradas breves al hacer scroll y contadores ======
const reduce = matchMedia("(prefers-reduced-motion:reduce)").matches;
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { threshold: 0.12 });
document.querySelectorAll(".rv,.tl").forEach(el => io.observe(el));
const nio = new IntersectionObserver(es => es.forEach(e => {
  if (!e.isIntersecting) return;
  nio.unobserve(e.target);
  const el = e.target, to = +el.dataset.to, pl = el.dataset.p ? "+" : "", fmt = v => pl + (el.dataset.raw ? v : v.toLocaleString("es-PR"));
  if (reduce) { el.textContent = fmt(to); return; }
  const t0 = performance.now();
  (function f(t) { const p = Math.min((t - t0) / 1000, 1); el.textContent = fmt(Math.round(to * (1 - Math.pow(1 - p, 3)))); if (p < 1) requestAnimationFrame(f); })(t0);
}), { threshold: 0.6 });
document.querySelectorAll(".num").forEach(el => nio.observe(el));

// ====== Botón de subir ======
const arriba = $("arriba");
let tick = false;
addEventListener("scroll", () => {
  if (tick) return; tick = true;
  requestAnimationFrame(() => {
    tick = false;
    const y = scrollY, h = document.documentElement.scrollHeight - innerHeight;
    arriba.classList.toggle("show", y > 500);
    $("prog").style.transform = "scaleX(" + (h > 0 ? y / h : 0) + ")";
    root.style.setProperty("--sy", Math.min(y, 900));
  });
}, { passive: true });
arriba.onclick = () => scrollTo({ top: 0, behavior: reduce ? "auto" : "smooth" });

// ====== Efectos: decodificado de etiquetas, palabras que giran, cintas y cursor ======
const GL = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
function descifrar(el) {
  const fin = el.textContent; if (reduce || !fin.trim()) return;
  const t0 = performance.now();
  (function f(t) {
    const p = Math.min((t - t0) / 650, 1), n = Math.floor(p * fin.length);
    el.textContent = fin.slice(0, n) + [...fin.slice(n)].map(c => c === " " || c === "/" ? c : GL[Math.floor(Math.random() * GL.length)]).join("");
    if (p < 1) requestAnimationFrame(f); else el.textContent = fin;
  })(t0);
}
const sio = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { sio.unobserve(e.target); descifrar(e.target); } }), { threshold: 0.6 });
document.querySelectorAll(".tag").forEach(el => { if (el.id !== "dtag" && !el.closest(".boot")) sio.observe(el); });

if (!reduce) {
  let ri = 0;
  setInterval(() => {
    const w = $("rwi"); if (!w || !w.offsetParent) return;
    ri++; w.style.transform = "translateY(-" + ri * 1.5 + "em)";
    if (ri === ROT_ITEMS.length) setTimeout(() => { w.style.transition = "none"; w.style.transform = "none"; ri = 0; requestAnimationFrame(() => requestAnimationFrame(() => (w.style.transition = ""))); }, 650);
  }, 2200);
  let ult = scrollY, vel = 1;
  (function bucle() {
    const d = Math.abs(scrollY - ult); ult = scrollY;
    vel += (1 + Math.min(d / 3, 10) - vel) * 0.08;
    document.querySelectorAll(".track").forEach(el => { const a = el.getAnimations()[0]; if (a) a.playbackRate = vel; });
    requestAnimationFrame(bucle);
  })();
}

if (matchMedia("(hover:hover)").matches && !reduce) {
  document.addEventListener("pointermove", e => {
    const t = e.target; if (!t.closest) return;
    const cv = t.closest(".cover");
    if (cv) { const r = cv.getBoundingClientRect(); cv.style.setProperty("--mx", e.clientX - r.left + "px"); cv.style.setProperty("--my", e.clientY - r.top + "px"); }
    const c = t.closest(".cat,.oc");
    if (c) { const r = c.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top; c.style.setProperty("--mx", x + "px"); c.style.setProperty("--my", y + "px"); c.style.setProperty("--ry", (x / r.width - 0.5) * 7 + "deg"); c.style.setProperty("--rx", (0.5 - y / r.height) * 7 + "deg"); }
    const b = t.closest(".btn");
    if (b) { const r = b.getBoundingClientRect(); b.style.setProperty("--tx", (e.clientX - r.left - r.width / 2) * 0.18 + "px"); b.style.setProperty("--ty", (e.clientY - r.top - r.height / 2) * 0.28 + "px"); }
  });
  document.addEventListener("pointerout", e => {
    const c = e.target.closest && e.target.closest(".cat,.oc,.btn");
    if (c && !c.contains(e.relatedTarget)) ["--rx", "--ry", "--tx", "--ty"].forEach(p => c.style.removeProperty(p));
  });
}

// ====== Pantalla de arranque ======
const boot = $("boot");
const empezar = () => { document.body.classList.add("go"); cadenaPortada(); };
if (reduce || !boot) { if (boot) boot.remove(); empezar(); }
else {
  document.body.classList.add("lock");
  let hecho = false;
  const fin = () => {
    if (hecho) return; hecho = true;
    boot.classList.add("up");
    setTimeout(empezar, 350);
    setTimeout(() => { boot.remove(); document.body.classList.remove("lock"); }, 900);
  };
  boot.addEventListener("click", fin);
  const t0 = performance.now();
  (function f(t) {
    if (hecho) return;
    const p = Math.min((t - t0) / 1200, 1);
    $("bn").textContent = String(Math.round(p * 100)).padStart(3, "0");
    $("bl").style.transform = "scaleX(" + p + ")";
    if (p < 1) requestAnimationFrame(f); else setTimeout(fin, 150);
  })(t0);
}
</script>
